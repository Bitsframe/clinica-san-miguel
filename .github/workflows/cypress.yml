name: Cypress Tests with Cloud Recording + ClickUp

on:
  push:
    branches:
      - mavra-testing

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 3.5️⃣ Create results directory
      - name: Create results directory
        run: mkdir -p cypress/results

      # 4️⃣ Run Cypress with Cloud recording (mochawesome configured in cypress.config.ts)
      - name: Cypress Cloud Run
        id: cypress
        uses: cypress-io/github-action@v6
        with:
          start: yarn dev
          wait-on: "http://localhost:3000"
          wait-on-timeout: 120
          command: npx cypress run --spec cypress/e2e/appointment-form.cy.ts --record
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # 5️⃣ Get Cypress Run ID
      - name: Get Cypress Run ID
        if: always()
        id: get-run-id
        run: |
          RUN_ID="${{ steps.cypress.outputs.runId }}"
          echo "runId=${RUN_ID}" >> $GITHUB_OUTPUT
          echo "🎯 Cypress Run ID: ${RUN_ID}"

      # 5.5️⃣ Merge mochawesome reports and debug
      - name: Merge mochawesome reports
        if: always()
        run: |
          echo "📁 Results directory contents:"
          ls -la cypress/results/ || echo "No results directory"
          if ls cypress/results/mochawesome*.json 1> /dev/null 2>&1; then
            echo "🔗 Merging mochawesome reports..."
            npx mochawesome-merge cypress/results/mochawesome*.json > cypress/results/merged-report.json
            echo "✅ Merged report created"
          else
            echo "⚠️ No mochawesome JSON files found to merge"
          fi

      # 6️⃣ Create ClickUp tasks for each failed test
      - name: Create ClickUp tasks for failed tests
        if: failure() || steps.cypress.outcome == 'failure'
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          CLICKUP_LIST_ID: ${{ secrets.CLICKUP_LIST_ID }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          CYPRESS_RUN_ID: ${{ steps.get-run-id.outputs.runId }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: node scripts/create-clickup-tasks-cloud.js
