name: Cypress Tests with Cloud Recording

on:
  push:
    branches:
      - mavra-testing

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Cypress run with Cloud Recording
        uses: cypress-io/github-action@v6
        with:
          # Start dev server
          start: yarn dev
          wait-on: "http://localhost:3000"
          wait-on-timeout: 120
          command: npx cypress run --record --spec cypress/e2e/spanish-language.cy.ts

        env:
          # Cypress Cloud credentials
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}

      - name: Test Report
        if: always()
        run: |
          echo "✅ Cypress Tests Completed!"
          echo ""
          echo "📊 View Results on Cypress Cloud:"
          echo "   https://cloud.cypress.io/organizations/YOUR-ORG-NAME/projects/${{ secrets.CYPRESS_PROJECT_ID }}"
