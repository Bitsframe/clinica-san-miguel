name: Deploy & Release Tests

on:
  push:
    branches:
      - mavra-testing
    tags:
      - "v*.*.*"
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: "Deploy to environment"
        required: true
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: "20.x"

jobs:
  pre-deploy-tests:
    name: Pre-Deployment Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: mavra-testing

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint check
        run: yarn lint

      - name: Build production bundle
        run: yarn build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NODE_ENV: production

      - name: Run full test suite
        uses: cypress-io/github-action@v6
        with:
          start: yarn start
          wait-on: "http://localhost:3000"
          wait-on-timeout: 120
          command: yarn test:e2e
          browser: chrome
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload pre-deploy test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre-deploy-test-results
          path: |
            cypress/screenshots
            cypress/videos
            cypress/results
          retention-days: 30

      - name: Fail if tests failed
        if: failure()
        run: |
          echo "::error::Pre-deployment tests failed! Blocking deployment."
          exit 1

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: pre-deploy-tests
    if: inputs.deploy_environment == 'staging' || github.event_name == 'workflow_dispatch'
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: mavra-testing

      - name: Deploy to Staging
        run: |
          echo "🚀 Deploying to staging..."
          # Add your deployment commands here
          # Example: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        run: |
          curl -f ${{ secrets.STAGING_URL }} || exit 1

  post-deploy-staging-tests:
    name: Post-Deploy Staging Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: mavra-testing

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run smoke tests on staging
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          config: baseUrl=${{ secrets.STAGING_URL }}
          spec: |
            cypress/e2e/main-flow.cy.ts
            cypress/e2e/data-integrity.cy.ts
        env:
          CYPRESS_BASE_URL: ${{ secrets.STAGING_URL }}

      - name: Run performance tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          config: baseUrl=${{ secrets.STAGING_URL }}
          command: yarn test:performance
        env:
          CYPRESS_BASE_URL: ${{ secrets.STAGING_URL }}

      - name: Upload staging test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-post-deploy-results
          path: |
            cypress/screenshots
            cypress/videos
          retention-days: 30

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [pre-deploy-tests, post-deploy-staging-tests]
    if: |
      (inputs.deploy_environment == 'production' || 
       github.event_name == 'release' || 
       startsWith(github.ref, 'refs/tags/v'))
    environment:
      name: production
      url: ${{ secrets.PRODUCTION_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: mavra-testing

      - name: Create deployment announcement
        run: |
          echo "## 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Deploying to production..." >> $GITHUB_STEP_SUMMARY

      - name: Deploy to Production
        run: |
          echo "🚀 Deploying to production..."
          # Add your production deployment commands here
          # Example: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Wait for deployment
        run: sleep 60

      - name: Health check
        run: |
          curl -f ${{ secrets.PRODUCTION_URL }} || exit 1

  post-deploy-production-tests:
    name: Post-Deploy Production Tests
    runs-on: ubuntu-latest
    needs: deploy-production
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: mavra-testing

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run critical path tests - ${{ matrix.browser }}
        uses: cypress-io/github-action@v6
        with:
          browser: ${{ matrix.browser }}
          config: baseUrl=${{ secrets.PRODUCTION_URL }}
          spec: |
            cypress/e2e/main-flow.cy.ts
            cypress/e2e/responsive.cy.ts
        env:
          CYPRESS_BASE_URL: ${{ secrets.PRODUCTION_URL }}

      - name: Upload production test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-post-deploy-${{ matrix.browser }}
          path: |
            cypress/screenshots
            cypress/videos
          retention-days: 90

      - name: Alert on production test failure
        if: failure()
        run: |
          echo "::error::Production tests failed on ${{ matrix.browser }}!"
          echo "## ⚠️ CRITICAL: Production Tests Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Browser: ${{ matrix.browser }}" >> $GITHUB_STEP_SUMMARY
          echo "Immediate attention required!" >> $GITHUB_STEP_SUMMARY

  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs:
      [
        pre-deploy-tests,
        post-deploy-staging-tests,
        post-deploy-production-tests,
      ]
    if: always()
    steps:
      - name: Create deployment summary
        run: |
          echo "## 📦 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-Deploy Tests | ${{ needs.pre-deploy-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Staging Tests | ${{ needs.post-deploy-staging-tests.result == 'success' && '✅ Passed' || needs.post-deploy-staging-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Production Tests | ${{ needs.post-deploy-production-tests.result == 'success' && '✅ Passed' || needs.post-deploy-production-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🕐 Completed at: $(date)" >> $GITHUB_STEP_SUMMARY

      - name: Notify team
        if: needs.post-deploy-production-tests.result == 'success'
        run: |
          echo "✅ Production deployment verified successfully!"
          # Add notification logic here (Slack, email, etc.)
