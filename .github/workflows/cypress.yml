name: Cypress Tests with Cloud Recording + ClickUp

on:
  push:
    branches:
      - mavra-testing

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 4️⃣ Run Cypress with Cloud recording
      - name: Cypress Cloud Run
        id: cypress
        uses: cypress-io/github-action@v6
        continue-on-error: true
        with:
          start: yarn dev
          wait-on: "http://localhost:3000"
          wait-on-timeout: 120
          command: npx cypress run --spec cypress/e2e/spanish-language.cy.ts --record --key ${{ secrets.CYPRESS_RECORD_KEY }}
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}

      # 5️⃣ Get Cypress Run ID from the run output (more reliable than API)
      - name: Get Cypress Run ID from output
        if: always()
        id: get-run-id
        run: |
          # Extract Run ID from Cypress output if available
          # You can also use the GitHub Action's built-in output
          echo "runId=${{ steps.cypress.outputs.runId }}" >> $GITHUB_OUTPUT
          echo "🎯 Cypress Run ID: ${{ steps.cypress.outputs.runId }}"

      # 6️⃣ Create ClickUp tasks from Cypress Cloud run
      - name: Create ClickUp tasks
        if: always()
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          CLICKUP_LIST_ID: ${{ secrets.CLICKUP_LIST_ID }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          CYPRESS_RUN_ID: ${{ steps.get-run-id.outputs.runId }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
        run: node scripts/create-clickup-tasks-cloud.js

      # 7️⃣ Fail workflow if Cypress failed
      - name: Fail workflow if Cypress failed
        if: steps.cypress.outcome == 'failure'
        run: exit 1