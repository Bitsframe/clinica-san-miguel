name: Cypress Tests with Cloud Recording + ClickUp

on:
  push:
    branches:
      - mavra-testing

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 4️⃣ Cypress Cloud run (records results in Cypress Cloud)
      - name: Cypress Cloud Run
        id: cypress-cloud
        uses: cypress-io/github-action@v6
        continue-on-error: true
        with:
          start: yarn dev
          wait-on: "http://localhost:3000"
          wait-on-timeout: 120
          command: npx cypress run --spec cypress/e2e/spanish-language.cy.ts --record
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}

      # 5️⃣ Cypress JSON report run (for ClickUp)
      - name: Cypress JSON Report
        id: cypress-json
        run: npx cypress run --spec cypress/e2e/spanish-language.cy.ts --reporter json --reporter-options output=./cypress-report.json

      # 6️⃣ Debug JSON report
      - name: Verify Cypress JSON
        if: always()
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la
          echo "Check cypress-report.json contents:"
          cat cypress-report.json || echo "⚠️ JSON not found"

      # 7️⃣ Create ClickUp tasks for each failed test
      - name: Create ClickUp Task if Tests Failed
        if: always()
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          CLICKUP_LIST_ID: ${{ secrets.CLICKUP_LIST_ID }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
        run: node scripts/create-clickup-tasks.js

      # 8️⃣ Fail workflow properly if any tests failed
      - name: Fail workflow if Cypress failed
        if: steps.cypress-json.outcome == 'failure'
        run: exit 1

      # 9️⃣ Show Cypress Cloud results
      - name: Cypress Cloud Report
        if: always()
        run: |
          echo "📊 Cypress Cloud Results:"
          echo "https://cloud.cypress.io/projects/${{ secrets.CYPRESS_PROJECT_ID }}"