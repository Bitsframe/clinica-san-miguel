name: ClickUp Integration - Create Tasks on Test Failures

on:
  workflow_run:
    workflows: ["Cypress Tests with Cloud Recording"]
    types:
      - completed

jobs:
  create-clickup-tasks:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install axios
        run: npm install axios

      - name: Create ClickUp Task for Failed Tests
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          CLICKUP_LIST_ID: ${{ secrets.CLICKUP_LIST_ID }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_REF_NAME: ${{ github.event.workflow_run.head_branch }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/create-clickup-tasks.js

      - name: Comment on PR if exists
        if: github.event.workflow_run.pull_requests[0]
        run: |
          echo "Tests failed and ClickUp task created!"

  close-clickup-tasks:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Add Success Comment
        run: |
          echo "✅ All tests passed! No ClickUp tasks needed."
